<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京小旅行</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="東京2026">
<meta name="application-name" content="東京2026">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Huninn&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ec; --ink:#4a3b32; --soft:#8a776a;
    --pink:#f7c9c4; --yellow:#fbe3a1; --mint:#c8e6d3; --blue:#c6dcf0; --lilac:#ddd0ee; --peach:#fbd6b5;
    --red:#e8776a;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Huninn","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.7; font-size:17px;
    background-image:radial-gradient(rgba(74,59,50,.07) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .hand{font-family:"LXGW WenKai TC","Huninn",cursive}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
  svg.doodle *{vector-effect:non-scaling-stroke}
  .ink{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  header{text-align:center;padding:36px 0 10px}
  .hero-art{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
  h1{font-family:"LXGW WenKai TC","Huninn",cursive;font-weight:700;font-size:clamp(34px,8vw,52px);margin:6px 0 0;letter-spacing:2px}
  h1 .mark{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 6px}
  .sub{color:var(--soft);margin:2px 0 0;font-size:17px}
  .count{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:8px 18px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-family:"LXGW WenKai TC","Huninn",cursive;font-size:20px;box-shadow:3px 3px 0 var(--ink)}
  .count b{font-size:26px;color:var(--red)}

  nav{position:sticky;top:0;z-index:10;background:rgba(251,246,236,.94);backdrop-filter:blur(4px);padding:10px 0;margin:22px -18px 0;border-bottom:2px dashed rgba(74,59,50,.25)}
  nav .row{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none;max-width:760px;margin:0 auto}
  nav .row::-webkit-scrollbar{display:none}
  nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:14px 18px 12px 16px;padding:4px 12px;background:#fff;font-size:15px;line-height:1.3;text-align:center}
  nav a small{display:block;font-size:12px;color:var(--soft)}
  nav a.on{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}

  section.day{margin-top:40px;scroll-margin-top:80px}
  .card{position:relative;background:#fff;border:2.4px solid var(--ink);border-radius:22px 26px 20px 28px / 26px 20px 28px 22px;padding:22px 20px 18px;box-shadow:5px 5px 0 rgba(74,59,50,.85)}
  .day-head{display:flex;gap:14px;align-items:center}
  .badge{flex:0 0 auto;width:74px;height:74px;border:2.4px solid var(--ink);border-radius:50% 46% 52% 48%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"LXGW WenKai TC","Huninn",cursive;line-height:1.05}
  .badge .d{font-size:28px}
  .badge .w{font-size:14px}
  .day-head h2{margin:0;font-family:"LXGW WenKai TC","Huninn",cursive;font-weight:700;font-size:28px;line-height:1.25}
  .day-head p{margin:2px 0 0;color:var(--soft);font-size:15px}
  .art{float:right;width:120px;height:120px;margin:-6px -4px 0 10px}
  @media (max-width:520px){.art{width:78px;height:78px}.day-head h2{font-size:25px}.day-head{gap:10px}}

  ol.tl{list-style:none;margin:18px 0 0;padding:0;position:relative;clear:both}
  ol.tl::before{content:"";position:absolute;left:85px;top:8px;bottom:8px;border-left:2.2px dashed rgba(74,59,50,.4)}
  ol.tl li{display:grid;grid-template-columns:50px 1fr;gap:20px;padding:6px 0;position:relative}
  ol.tl li::before{content:none}
  .t{font-family:"LXGW WenKai TC","Huninn",cursive;font-size:16px;color:var(--soft);padding-top:4px;text-align:right}
  .what{display:grid;grid-template-columns:38px 1fr;align-items:start}
  .what .ic-bub{grid-row:1 / span 2;margin:0}
  .what b{font-weight:700;grid-column:2;padding-top:3px}
  .what .n{display:block;font-size:15px;color:var(--soft);grid-column:2}
  .tbd{color:var(--soft);font-weight:400 !important}
  .stay{display:inline-block;margin-top:12px;font-size:14px;padding:2px 10px;border-radius:999px;border:1.8px solid var(--ink);background:var(--paper)}

  .fl-date{font-family:"LXGW WenKai TC","Huninn",cursive;font-size:19px;margin:14px 0 0}
  .flight{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;padding:6px 0 4px}
  .flight .tm{font-family:"LXGW WenKai TC","Huninn",cursive;font-size:30px;line-height:1.1}
  .flight .ap{font-size:14px;color:var(--soft)}
  .flight .mid{font-size:14px;color:var(--soft);min-width:110px}
  .flight .mid .line{display:block;border-top:2px dashed var(--ink);margin:6px 0 2px;position:relative}
  .flight .mid .line::after{content:"";position:absolute;right:-2px;top:-6px;width:8px;height:8px;border-top:2px solid var(--ink);border-right:2px solid var(--ink);transform:rotate(45deg)}
  .fl-sep{border:0;border-top:2px dashed rgba(74,59,50,.25);margin:10px 0 0}

  footer{text-align:center;margin-top:46px;color:var(--soft);font-size:15px}
  .wiggle{animation:wig 3.2s ease-in-out infinite;transform-origin:center bottom}
  @keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .float{animation:fl 4s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce){.wiggle,.float{animation:none}}

  .todo-add{display:flex;gap:8px;margin-top:14px}
  .todo-add input{flex:1;min-width:0;font:inherit;padding:6px 12px;border:2px solid var(--ink);border-radius:12px 14px 10px 16px;background:var(--paper);color:var(--ink)}
  .todo-add button,.todo-reset{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:14px 12px 16px 10px;background:var(--yellow);color:var(--ink);padding:4px 14px;box-shadow:2px 2px 0 var(--ink)}
  .todo-add button:active{transform:translate(2px,2px);box-shadow:none}
  .chk{list-style:none;margin:12px 0 0;padding:0}
  .chk li{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1.5px dashed rgba(74,59,50,.18)}
  .chk label{flex:1;display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:16px}
  .chk input{appearance:none;flex:0 0 auto;width:20px;height:20px;margin-top:3px;border:2px solid var(--ink);border-radius:6px 5px 7px 5px;background:#fff;display:grid;place-content:center;cursor:pointer}
  .chk input:checked{background:var(--mint)}
  .chk input:checked::after{content:"";width:9px;height:5px;border-left:2.4px solid var(--ink);border-bottom:2.4px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
  .chk input:checked + span{text-decoration:line-through;color:var(--soft)}
  .chk .del{border:0;background:none;color:var(--soft);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
  .chk .del:hover{color:var(--red)}
  .todo-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--soft)}
  .todo-reset{background:#fff;font-size:12px;padding:2px 10px;box-shadow:none}
  .prog{height:10px;border:2px solid var(--ink);border-radius:999px;margin-top:10px;overflow:hidden;background:#fff}
  .prog i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}

  .ic{width:20px;height:20px;vertical-align:-4px;margin-right:6px;color:var(--ink);flex:0 0 auto}
  .ic-bub{position:relative;z-index:1;display:inline-grid;place-items:center;width:30px;height:30px;border:1.8px solid var(--ink);border-radius:48% 52% 50% 46%;background:var(--bg,var(--paper));margin-right:8px;vertical-align:-9px}
  .ic-bub .ic{margin:0;width:18px;height:18px}
  nav a .ic{display:block;margin:0 auto 1px;width:18px;height:18px}
  .stay{display:inline-flex;align-items:center}
  .stay .ic{width:17px;height:17px;margin-right:5px;vertical-align:0}
  .day-head h2 .ic{width:26px;height:26px;vertical-align:-4px}
  .deco{display:flex;justify-content:center;align-items:center;gap:18px;margin:26px 0 -14px;color:var(--soft)}
  .deco svg{width:22px;height:22px}
  .deco svg:nth-child(2){width:28px;height:28px;color:var(--ink)}
  .deco .ln{flex:0 1 80px;border-top:2px dashed rgba(74,59,50,.3)}
  .count .ic{width:22px;height:22px;margin:0}
  .fl-date .ic{width:18px;height:18px}

  [hidden]{display:none !important}
  .pin-box{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
  .pin-art{width:26px;height:26px;color:var(--ink)}
  .pin-box input{flex:1;min-width:120px;font:inherit;font-size:20px;letter-spacing:6px;text-align:center;padding:6px 12px;border:2px solid var(--ink);border-radius:12px 14px 10px 16px;background:var(--paper);color:var(--ink)}
  .pin-box button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:14px 12px 16px 10px;background:var(--yellow);color:var(--ink);padding:6px 16px;box-shadow:2px 2px 0 var(--ink)}
  .pin-box button:disabled{opacity:.6}
  .pin-err{flex-basis:100%;margin:0;min-height:1.4em;font-size:14px;color:var(--red)}
  .who{font-style:normal;display:inline-block;margin-left:6px;font-size:12px;padding:0 8px;border-radius:999px;border:1.5px solid var(--ink);background:var(--mint);color:var(--ink);vertical-align:1px;text-decoration:none}
  .hi{font-weight:700;color:var(--ink)}

  .gate{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0;text-align:center}
  .gate .card{width:100%;max-width:380px;margin-top:22px;text-align:left}
  .gate .pin-box{margin-top:6px}
  .gate .lead{margin:0;color:var(--soft);font-size:15px}
  .loading{text-align:center;color:var(--soft);padding:40px 0}

  .tl-empty{display:block !important;color:var(--soft);font-size:15px;padding:6px 0 6px 70px !important}
  .acts{grid-column:2;display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .acts button,.plan-tools button{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:13px;cursor:pointer;border:1.6px solid var(--ink);border-radius:10px 12px 9px 11px;background:#fff;color:var(--ink);padding:2px 9px;line-height:1.5}
  .acts button svg,.plan-tools button svg{width:15px;height:15px}
  .acts button:disabled{opacity:.35;cursor:default}
  .acts .sq{padding:2px 5px}
  .acts .danger{color:var(--red);border-color:var(--red)}
  .plan-tools{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .plan-tools .on{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
  .plan-tools .add{background:var(--mint)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(74,59,50,.35);display:flex;align-items:flex-end;justify-content:center;padding:16px}
  @media (min-width:560px){.modal{align-items:center}}
  .modal .card{width:100%;max-width:460px;max-height:90vh;overflow-y:auto;overflow-x:hidden}
  .modal h3{margin:0 0 10px;font-family:"LXGW WenKai TC","Huninn",cursive;font-size:22px}
  .fld{display:block;margin:10px 0}
  .fld span{display:block;font-size:14px;color:var(--soft);margin-bottom:3px}
  .fld input{width:100%;font:inherit;padding:6px 12px;border:2px solid var(--ink);border-radius:12px 14px 10px 16px;background:var(--paper);color:var(--ink)}
  .icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
  .icons label{display:grid;place-items:center;height:44px;border:1.8px solid rgba(74,59,50,.3);border-radius:12px;cursor:pointer;background:var(--c,#fff)}
  .icons input{position:absolute;opacity:0;pointer-events:none}
  .icons svg{width:22px;height:22px;color:var(--ink)}
  .icons input:checked + svg{transform:scale(1.15)}
  .icons label:has(input:checked){border-color:var(--ink);border-width:2.4px;box-shadow:2px 2px 0 var(--ink)}
  .icons label:focus-within{outline:2px dashed var(--ink);outline-offset:2px}
  .mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .mbtns button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:14px 12px 16px 10px;background:#fff;color:var(--ink);padding:4px 16px}
  .mbtns .primary{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
  .merr{color:var(--red);font-size:14px;min-height:1.3em;margin:6px 0 0}

  .msum{margin-top:14px}
  .mtotal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .mtotal b{font-family:"LXGW WenKai TC","Huninn",cursive;font-size:34px;line-height:1.1}
  .mtotal span{color:var(--soft);font-size:15px}
  .mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1.8px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px;background:var(--paper)}
  .settle{margin-top:12px;padding:10px 14px;border:2px dashed var(--ink);border-radius:14px;background:#fffbe9;font-size:15px}
  .settle b{color:var(--red)}
  .cats{margin-top:12px;display:grid;gap:6px}
  .cat{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px;font-size:14px}
  .cat .bar{height:12px;border:1.8px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
  .cat .bar i{display:block;height:100%;background:var(--c)}
  .rate{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;color:var(--soft)}
  .rate input{width:78px;font:inherit;font-size:14px;padding:1px 8px;border:1.8px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
  .eday{margin-top:16px}
  .eday h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px;font-family:"LXGW WenKai TC","Huninn",cursive;font-size:18px;border-bottom:2px dashed rgba(74,59,50,.25);padding-bottom:2px}
  .eday h4 small{font-family:"Huninn",sans-serif;font-size:13px;color:var(--soft)}
  .erow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;width:100%;padding:7px 0;border:0;border-bottom:1.5px dashed rgba(74,59,50,.15);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
  .erow .ic-bub{margin:0}
  .erow .nm{font-size:16px;line-height:1.35}
  .erow .sub{display:block;font-size:12px;color:var(--soft)}
  .erow .am{font-family:"LXGW WenKai TC","Huninn",cursive;font-size:18px;white-space:nowrap}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg label{position:relative;cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:inline-block;border:1.8px solid var(--ink);border-radius:12px 10px 13px 9px;padding:3px 12px;font-size:15px;background:#fff;color:var(--ink);margin:0}
  .seg input:checked + span{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
  .seg input:focus-visible + span{outline:2px dashed var(--ink);outline-offset:2px}
  .amtrow{display:flex;gap:8px;align-items:center}
  .amtrow input{flex:1;font-family:"LXGW WenKai TC","Huninn",cursive;font-size:22px}
  .mbtns .danger{margin-right:auto;color:var(--red);border-color:var(--red)}

  .what .d{grid-column:2;display:block;font-size:14px;line-height:1.6;color:var(--ink);opacity:.85;margin-top:2px}
  .maplink{grid-column:2;justify-self:start;display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:13px;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:999px;padding:0 10px 0 6px;background:var(--paper)}
  .maplink svg{width:15px;height:15px}
  .maplink:hover{background:var(--yellow)}
  .fld textarea{width:100%;font:inherit;font-size:15px;padding:6px 12px;border:2px solid var(--ink);border-radius:12px 14px 10px 16px;background:var(--paper);color:var(--ink);resize:vertical;min-height:64px}
  .fld .hint{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--soft)}
  .fld .hint button{font:inherit;font-size:12px;cursor:pointer;border:1.5px solid var(--ink);border-radius:9px;background:#fff;color:var(--ink);padding:1px 8px}

  ol.tl li.near .t{font-size:13px;padding-top:6px}
  ol.tl li.near .ic-bub{transform:scale(.82);border-style:dashed}
  ol.tl li.near b{font-weight:500}
  .neartag{display:inline-block;font-size:11px;font-weight:400;padding:0 7px;margin-left:6px;border:1.4px dashed var(--ink);border-radius:999px;background:var(--paper);vertical-align:2px}
  .chkline{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:15px;cursor:pointer}
  .chkline input{width:18px;height:18px;accent-color:var(--ink)}

  ol.tl li.move .t{font-size:13px;padding-top:6px}
  ol.tl li.move .ic-bub{border-style:dashed;background:#fff !important}
  ol.tl li.move b{font-weight:500;font-size:15px;color:var(--soft)}
  ol.tl li.move .n{color:var(--ink)}

  ol.tl li.alt .ic-bub{border-style:dashed;transform:scale(.88)}
  ol.tl li.alt .t{color:#8c6bb3}
  ol.tl li.alt b{font-weight:500}
  .alttag{display:inline-block;font-size:11px;font-weight:400;padding:0 7px;margin-left:6px;border:1.4px dashed #8c6bb3;color:#6b4f8f;border-radius:999px;background:var(--lilac);vertical-align:2px}

  /* 支線：另一條平行虛線，從主線分出去、最後再接回來 */
  ol.tl li.branch{display:block;position:relative;padding:16px 0}
  ol.tl-branch{list-style:none;margin:0;padding:0;position:relative}
  ol.tl-branch::before{content:"";position:absolute;left:125px;top:10px;bottom:10px;border-left:2.2px dashed #8c6bb3}
  ol.tl-branch li{display:grid;grid-template-columns:50px 1fr;gap:20px;padding:6px 0;position:relative}
  ol.tl-branch li .what{margin-left:40px}
  ol.tl li.branch::before{content:"";position:absolute;left:84px;top:0;width:41px;height:26px;border-top:2.2px dashed #8c6bb3;border-right:2.2px dashed #8c6bb3;border-top-right-radius:20px}
  ol.tl li.branch::after{content:"";position:absolute;left:84px;bottom:0;width:41px;height:26px;border-bottom:2.2px dashed #8c6bb3;border-right:2.2px dashed #8c6bb3;border-bottom-right-radius:20px}
  .branch-note{display:block;font-size:12px;color:#8c6bb3;margin:0 0 4px 138px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plane" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 13l15-3c2-.4 3 .2 3 1s-1 1.4-3 1.6L3 14.5zM9 11.8L6.5 6l2.5-.4 5 5.9M10 13.6L8.5 19l2.4-.4 3.6-5.3M4 13l-1.6-2.6 1.6-.3 2 2.6"/></symbol>
<symbol id="i-land" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8l14 5c1.8.6 2.4 1.5 2 2.2s-1.4.8-3.2.2L3 10.5zM9.2 10l.3-5.6 2.2.8 2.3 6.4M3 20h18"/></symbol>

<script>
(function(){
  // 部署好 Apps Script 之後，把「網頁應用程式網址」貼在這裡
  var GAS_URL='https://script.google.com/macros/s/AKfycbwiMANIQxFkY4kmGDFTUVuhDhIgdfWwU1v08mkpAh9JrUknSGmKHXAgzFmY_cWkPHo8hg/exec';
  var PKEY='tokyo26-pin', POLL_MS=20000;
  var $=function(id){return document.getElementById(id)};
  var gate=$('gate'), app=$('app'), pinForm=$('pinForm'), pinInput=$('pinInput'), pinErr=$('pinErr');
  var pin=null, me=null, items=[], plans=[], expenses=[], rate=0.2, members=[], editing={}, busy=0, timer=null, navObs=null, editId=null, editDay=null;
  var ICONS=[['plane','blue','起飛'],['land','blue','降落'],['train','blue','電車'],['walk','mint','散步'],['tower','pink','鐵塔'],['tree','mint','自然'],['castle','lilac','樂園'],['ship','lilac','船'],['food','peach','吃飯'],['shop','pink','購物'],['camera','yellow','拍照'],['torii','peach','神社'],['post','pink','郵筒'],['museum','lilac','博物館'],['yarn','mint','手作'],['ticket','peach','門票'],['bag','yellow','行李'],['key','peach','退房'],['bed','blue','住宿'],['home','pink','回家'],['map','yellow','其他'],['star','yellow','重點'],['heart','pink','喜歡'],['sun','yellow','白天'],['moon','lilac','晚上']];
  var ICON_COLOR={};ICONS.forEach(function(x){ICON_COLOR[x[0]]=x[1]});

  function api(action,data){
    data=data||{}; data.action=action; data.pin=pin;
    return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
      .then(function(r){return r.json()})
      .then(function(res){
        if(!res.ok){var e=new Error(res.error||'error');e.code=res.code;throw e;}
        return res;
      });
  }
  // 預覽視窗可能禁止表單送出，所以改成直接處理按鈕和 Enter 鍵
  function onSubmit(form,fn){
    if(!form)return;
    var run=function(){fn({preventDefault:function(){}});};
    form.addEventListener('submit',function(e){e.preventDefault();run();});
    form.querySelectorAll('button[type="submit"]').forEach(function(b){
      b.addEventListener('click',function(e){e.preventDefault();if(!b.disabled)run();});
    });
    form.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.isComposing&&e.target.tagName==='INPUT'){e.preventDefault();run();}
    });
  }
  function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  /* ---------- 登入 / 登出 ---------- */
  function showGate(msg){
    pin=null;me=null;items=[];plans=[];expenses=[];editing={};closeModal();closeExp();stopPoll();store(PKEY,null);
    if(navObs){navObs.disconnect();navObs=null;}
    app.innerHTML='';gate.hidden=false;pinForm.hidden=false;
    pinErr.textContent=msg||'';document.title='東京小旅行';
    try{pinInput.focus()}catch(e){}
  }
  function login(p){
    pin=p;var btn=pinForm.querySelector('button');btn.disabled=true;pinErr.textContent='確認中…';
    return api('login').then(function(res){
      me=res.member;store(PKEY,pin);pinErr.textContent='';
      gate.hidden=true;app.innerHTML=res.html||'';
      document.title='東京小旅行 2026.12.18–23';
      mount();setAll(res);startPoll();
      if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();}
    }).catch(function(e){
      pin=null;gate.hidden=false;pinForm.hidden=false;
      if(e.code==='bad_pin'){store(PKEY,null);pinErr.textContent='PIN 碼不對，再試一次';}
      else if(e.code==='locked'){pinErr.textContent='嘗試太多次，請 10 分鐘後再試';}
      else{pinErr.textContent='連不上伺服器，稍後再試';}
    }).finally(function(){btn.disabled=false;});
  }
  onSubmit(pinForm,function(e){
    e.preventDefault();var v=pinInput.value.trim();if(!v)return;pinInput.value='';login(v);
  });

  /* ---------- 行程頁載入後 ---------- */
  function mount(){
    // 倒數
    var el=$('count');
    if(el){
      var now=new Date(), dep=new Date('2026-12-18T09:30:00+08:00');
      var d=Math.ceil((dep-now)/86400000);
      if(d>0){$('cd').textContent=d;}
      else if(now<new Date('2026-12-23T18:00:00+08:00')){
        var day=Math.floor((now-new Date('2026-12-18T00:00:00+08:00'))/86400000)+1;
        el.innerHTML='旅行中 <b>Day '+day+'</b>';
      }else{el.innerHTML='旅行結束啦';}
    }
    // 目前所在日期的導覽按鈕
    var links=[].slice.call(document.querySelectorAll('#nav a'));
    navObs=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(a){
            var on=a.getAttribute('href')==='#'+e.target.id;
            a.classList.toggle('on',on);
            if(on){a.parentNode.scrollTo({left:a.offsetLeft-20,behavior:'smooth'});}
          });
        }
      });
    },{rootMargin:'-40% 0px -55% 0px'});
    document.querySelectorAll('section.day').forEach(function(s){navObs.observe(s)});
    // 待辦
    var mode=$('todoMode');
    if(mode){
      mode.innerHTML='';var h=document.createElement('span');h.className='hi';h.textContent='嗨，'+me;
      mode.appendChild(h);mode.appendChild(document.createTextNode('・兩人共用，每 20 秒自動更新'));
    }
    var form=$('todoForm'), inp=$('todoInput');
    if(form)onSubmit(form,function(e){
      e.preventDefault();var v=inp.value.trim();if(!v)return;inp.value='';
      items.push({id:'tmp',t:v,d:false});render();send('add',{text:v});
    });
    var ea=$('expAdd');if(ea)ea.addEventListener('click',function(){openExp(null)});
    var lo=$('logoutBtn');if(lo)lo.addEventListener('click',function(){showGate('');window.scrollTo(0,0);});
  }

  /* ---------- 待辦清單 ---------- */
  function meta(){
    var done=items.filter(function(x){return x.d}).length;
    if($('todoCount'))$('todoCount').textContent='完成 '+done+' / '+items.length;
    if($('prog'))$('prog').style.width=(items.length?done/items.length*100:0)+'%';
  }
  function render(){
    var ul=$('todoList');if(!ul)return;
    ul.innerHTML='';
    if(!items.length){var e=document.createElement('li');e.style.color='var(--soft)';e.textContent='清單是空的，從下面新增吧！';ul.appendChild(e);}
    items.forEach(function(it){
      var li=document.createElement('li'), lab=document.createElement('label');
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!it.d;
      cb.onchange=function(){toggle(it,cb.checked)};
      var sp=document.createElement('span');sp.textContent=String(it.t||'');
      if(it.d&&it.by){var w=document.createElement('em');w.className='who';w.textContent=it.by+' 完成';sp.appendChild(w);}
      lab.appendChild(cb);lab.appendChild(sp);li.appendChild(lab);
      var del=document.createElement('button');del.type='button';del.className='del';del.textContent='×';del.setAttribute('aria-label','刪除');
      del.onclick=function(){remove(it)};li.appendChild(del);
      ul.appendChild(li);
    });
    meta();
  }
  function setItems(list){if(Array.isArray(list)){items=list;render();}}
  function note(t){if($('todoNote'))$('todoNote').textContent=t;}
  function refresh(){
    if(!pin||busy||document.hidden)return;
    api('list').then(function(r){if(!busy)setAll(r);note('');}).catch(fail);
  }
  function startPoll(){stopPoll();timer=setInterval(refresh,POLL_MS);}
  function stopPoll(){if(timer){clearInterval(timer);timer=null;}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
  function fail(e){
    if(e&&e.code==='bad_pin'){showGate('PIN 碼已失效，請重新輸入');return;}
    note('沒存到，稍後再試一次');
  }
  function send(action,data){
    busy++;note('儲存中…');
    return api(action,data).then(function(r){busy--;note('');if(!busy)setAll(r);})
      .catch(function(e){busy--;fail(e);refresh();});
  }
  function toggle(it,v){it.d=v;it.by=v?me:'';render();send('toggle',{id:it.id,done:v});}
  function remove(it){items=items.filter(function(x){return x!==it});render();send('remove',{id:it.id});}


  /* ---------- 每日行程 ---------- */
  function setAll(r){
    if(!r)return;
    if(Array.isArray(r.members))members=r.members;
    if(typeof r.rate==='number')rate=r.rate;
    if(Array.isArray(r.plans)){plans=r.plans;renderPlans();}
    if(Array.isArray(r.expenses)){expenses=r.expenses;renderMoney();}
    setItems(r.items);
  }
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function icon(name,cls){
    var ns='http://www.w3.org/2000/svg',sv=document.createElementNS(ns,'svg'),u=document.createElementNS(ns,'use');
    sv.setAttribute('class',cls||'ic');sv.setAttribute('aria-hidden','true');u.setAttribute('href','#i-'+name);sv.appendChild(u);return sv;
  }
  function btn(txt,ic,fn,cls){var b=el('button',cls||'');b.type='button';if(ic)b.appendChild(icon(ic,''));b.appendChild(document.createTextNode(txt));b.onclick=fn;return b;}
  function dayPlans(d){return plans.filter(function(p){return p.day===d}).sort(function(a,b){return a.o-b.o});}
  function renderPlans(){
    document.querySelectorAll('ol.tl[data-day]').forEach(function(ol){
      var d=ol.getAttribute('data-day'), list=dayPlans(d), ed=!!editing[d];
      ol.innerHTML='';
      if(!list.length)ol.appendChild(el('li','tl-empty','還沒有行程'));
      var branchOl=null;
      list.forEach(function(p,i){
        var li=el('li'), what=el('span','what'), bub=el('span','ic-bub');
        var ic=ICON_COLOR[p.icon]?p.icon:'map';
        bub.style.setProperty('--bg','var(--'+ICON_COLOR[ic]+')');bub.appendChild(icon(ic));
        what.appendChild(bub);what.appendChild(el('b',null,p.title));
        if(p.note)what.appendChild(el('span','n',p.note));
        if(p.desc)what.appendChild(el('span','d',p.desc));
        if(p.map&&/^https:\/\//.test(p.map)){
          var a0=el('a','maplink');a0.href=p.map;a0.target='_blank';a0.rel='noopener';
          a0.appendChild(icon('pin',''));a0.appendChild(document.createTextNode('Google 地圖'));what.appendChild(a0);
        }
        if(ed){
          var a=el('span','acts');
          a.appendChild(btn('修改','pen',function(){openModal(d,p)}));
          var up=btn('','up',function(){sendPlan('planMove',{id:p.id,dir:-1})},'sq');up.setAttribute('aria-label','上移');up.title='上移';up.disabled=i===0;a.appendChild(up);
          var dn=btn('','down',function(){sendPlan('planMove',{id:p.id,dir:1})},'sq');dn.setAttribute('aria-label','下移');dn.title='下移';dn.disabled=i===list.length-1;a.appendChild(dn);
          a.appendChild(btn('刪除','trash',function(){askDelete(this,p)},'danger'));
          what.appendChild(a);
        }
        if(p.time==='移動')li.className='move';
        if(p.alt){li.className='alt';var tb2=what.querySelector('b');if(tb2)tb2.appendChild(el('span','alttag','支線'));}
        if(p.near){li.className='near';var tb=what.querySelector('b');if(tb)tb.appendChild(el('span','neartag','附近景點'));}
        li.appendChild(el('span','t',p.time||(p.near?'附近':'')));li.appendChild(what);
        if(p.alt){
          if(!branchOl){
            var bli=el('li','branch');bli.appendChild(el('span','branch-note','支線：看當天時間決定要不要走'));
            branchOl=el('ol','tl-branch');bli.appendChild(branchOl);ol.appendChild(bli);
          }
          branchOl.appendChild(li);
        }else{branchOl=null;ol.appendChild(li);}
      });
      var tools=document.querySelector('.plan-tools[data-day="'+d+'"]');
      if(tools){
        tools.innerHTML='';
        if(ed)tools.appendChild(btn('新增行程','plus',function(){openModal(d,null)},'add'));
        tools.appendChild(btn(ed?'完成':'編輯行程',ed?'check':'pen',function(){editing[d]=!ed;renderPlans();},ed?'on':''));
      }
    });
  }
  function askDelete(b,p){
    if(b.getAttribute('data-sure')){sendPlan('planRemove',{id:p.id});return;}
    b.setAttribute('data-sure','1');b.lastChild.textContent='確定刪除？';
    setTimeout(function(){if(b.isConnected){b.removeAttribute('data-sure');b.lastChild.textContent='刪除';}},3000);
  }
  function sendPlan(action,data){
    busy++;note('儲存中…');
    return api(action,data).then(function(r){busy--;note('');setAll(r);return true;})
      .catch(function(e){busy--;fail(e);refresh();return false;});
  }
  // 編輯視窗
  var modal=$('planModal'), pform=$('planForm'), pfIcons=$('pfIcons');
  ICONS.forEach(function(x){
    var lab=el('label');lab.title=x[2];lab.style.setProperty('--c','var(--'+x[1]+')');
    var r=el('input');r.type='radio';r.name='pfIcon';r.value=x[0];r.setAttribute('aria-label',x[2]);
    lab.appendChild(r);lab.appendChild(icon(x[0],''));pfIcons.appendChild(lab);
  });
  function openModal(d,p){
    editDay=d;editId=p?p.id:null;
    $('planTitle').textContent=p?'修改行程':'新增行程';
    $('pfTime').value=p?p.time:'';$('pfName').value=p?p.title:'';$('pfNote').value=p?p.note:'';
    $('pfDesc').value=p&&p.desc?p.desc:'';$('pfNear').checked=!!(p&&p.near);$('pfAlt').checked=!!(p&&p.alt);$('pfMap').value=p&&p.map?p.map:'';
    var ic=p&&ICON_COLOR[p.icon]?p.icon:'map';
    pfIcons.querySelectorAll('input').forEach(function(r){r.checked=r.value===ic});
    $('pfErr').textContent='';modal.hidden=false;
    setTimeout(function(){try{$('pfName').focus()}catch(e){}},50);
  }
  function closeModal(){if(modal)modal.hidden=true;editId=null;editDay=null;}
  $('pfCancel').onclick=closeModal;
  $('pfMapGen').onclick=function(){
    var q=$('pfName').value.trim();if(!q){$('pfErr').textContent='請先輸入行程名稱';return;}
    $('pfMap').value='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);$('pfErr').textContent='';
  };
  modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeModal();});
  onSubmit(pform,function(e){
    e.preventDefault();
    var title=$('pfName').value.trim();if(!title){$('pfErr').textContent='請輸入行程';return;}
    var sel=pfIcons.querySelector('input:checked');
    var mp=$('pfMap').value.trim();
    if(mp&&!/^https:\/\/(www\.google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps)/.test(mp)){$('pfErr').textContent='請貼 Google 地圖的連結';return;}
    var data={id:editId,day:editDay,time:$('pfTime').value.trim(),title:title,note:$('pfNote').value.trim(),desc:$('pfDesc').value.trim(),map:mp,near:$('pfNear').checked,alt:$('pfAlt').checked,icon:sel?sel.value:'map'};
    var sb=$('pfSave');sb.disabled=true;$('pfErr').textContent='儲存中…';
    sendPlan('planSave',data).then(function(ok){
      sb.disabled=false;
      if(ok)closeModal();else $('pfErr').textContent='沒存到，稍後再試一次';
    });
  });


  /* ---------- 記帳 ---------- */
  var DAY_LABEL={pre:'行前',d1:'12/18（五）',d2:'12/19（六）',d3:'12/20（日）',d4:'12/21（一）',d5:'12/22（二）',d6:'12/23（三）'};
  var DAY_SHORT={pre:'行前',d1:'12/18',d2:'12/19',d3:'12/20',d4:'12/21',d5:'12/22',d6:'12/23'};
  var CATS=[['food','餐飲','food','peach'],['traffic','交通','train','blue'],['shop','購物','shop','pink'],['ticket','門票','ticket','yellow'],['hotel','住宿','bed','lilac'],['other','其他','star','mint']];
  var CAT={};CATS.forEach(function(c){CAT[c[0]]={name:c[1],icon:c[2],color:c[3]}});
  function fmt(n,cur){
    var v=Math.round(n*100)/100;
    var t=v.toLocaleString('zh-TW',{maximumFractionDigits:cur==='JPY'?0:2});
    return cur==='JPY'?'¥'+t:'NT$'+t;
  }
  function toTwd(x){return x.cur==='JPY'?x.amt*rate:x.amt;}
  function renderMoney(){
    var box=$('moneySum'), list=$('expList');if(!box||!list)return;
    var tot={JPY:0,TWD:0}, paid={}, shareP={}, byCat={};
    members.forEach(function(m){paid[m]={JPY:0,TWD:0};shareP[m]={JPY:0,TWD:0};});
    expenses.forEach(function(x){
      tot[x.cur]+=x.amt;
      if(!paid[x.payer])paid[x.payer]={JPY:0,TWD:0},shareP[x.payer]={JPY:0,TWD:0};
      paid[x.payer][x.cur]+=x.amt;
      if(x.split!=='self')shareP[x.payer][x.cur]+=x.amt;
      byCat[x.cat]=(byCat[x.cat]||0)+toTwd(x);
    });
    box.innerHTML='';
    var all=tot.JPY*rate+tot.TWD;
    var t=el('div','mtotal');t.appendChild(el('b',null,'約 '+fmt(all,'TWD')));
    t.appendChild(el('span',null,'日圓 '+fmt(tot.JPY,'JPY')+'・台幣 '+fmt(tot.TWD,'TWD')));box.appendChild(t);
    var r=el('div','mrow');
    members.forEach(function(m){
      var pp=paid[m]||{JPY:0,TWD:0};
      var p=el('span','pill');p.appendChild(icon('wallet',''));p.querySelector('svg').style.cssText='width:16px;height:16px';
      p.appendChild(document.createTextNode(m+' 付了 '+fmt(pp.JPY,'JPY')+(pp.TWD?' ＋ '+fmt(pp.TWD,'TWD'):'')));r.appendChild(p);
    });
    box.appendChild(r);
    // 結算（平分的部分，各幣別分開算）
    var st=el('div','settle');
    if(members.length===2){
      var a=members[0],b=members[1],lines=[];
      ['JPY','TWD'].forEach(function(c){
        var d=((shareP[a][c]||0)-(shareP[b][c]||0))/2;
        if(Math.abs(d)>=(c==='JPY'?1:0.5))lines.push(d>0?[b,a,d,c]:[a,b,-d,c]);
      });
      if(!lines.length)st.textContent='平分的花費目前兩清';
      else lines.forEach(function(l,i){
        if(i)st.appendChild(el('br'));
        st.appendChild(document.createTextNode(l[0]+' 要給 '+l[1]+' '));st.appendChild(el('b',null,fmt(l[2],l[3])));
      });
    }
    box.appendChild(st);
    // 分類
    if(all>0){
      var cats=el('div','cats');
      CATS.forEach(function(c){
        var v=byCat[c[0]]||0;if(!v)return;
        var row=el('div','cat');row.appendChild(el('span',null,c[1]));
        var bar=el('span','bar'),fill=el('i');fill.style.setProperty('--c','var(--'+c[3]+')');fill.style.width=(v/all*100).toFixed(1)+'%';
        bar.appendChild(fill);row.appendChild(bar);row.appendChild(el('span',null,'約 '+fmt(v,'TWD')));cats.appendChild(row);
      });
      box.appendChild(cats);
    }
    // 匯率
    var rt=el('label','rate');rt.appendChild(document.createTextNode('匯率　1 日圓 ＝'));
    var ri=el('input');ri.inputMode='decimal';ri.value=String(rate);ri.setAttribute('aria-label','匯率');
    rt.appendChild(ri);rt.appendChild(document.createTextNode('台幣'));
    ri.addEventListener('change',function(){
      var v=Number(ri.value);if(!(v>0&&v<10)){ri.value=String(rate);return;}
      if(v!==rate){rate=v;renderMoney();sendPlan('setRate',{rate:v});}
    });
    box.appendChild(rt);
    // 明細（依日期）
    list.innerHTML='';
    if(!expenses.length){list.appendChild(el('p','tl-empty','還沒有記帳，按「記一筆」開始'));return;}
    ['pre','d1','d2','d3','d4','d5','d6'].forEach(function(d){
      var xs=expenses.filter(function(x){return x.day===d});if(!xs.length)return;
      xs.sort(function(p,q){return String(p.at).localeCompare(String(q.at))});
      var g=el('div','eday'),h=el('h4',null,DAY_LABEL[d]);
      var sj=0,stw=0;xs.forEach(function(x){if(x.cur==='JPY')sj+=x.amt;else stw+=x.amt;});
      h.appendChild(el('small',null,[sj?fmt(sj,'JPY'):'',stw?fmt(stw,'TWD'):''].filter(Boolean).join(' ＋ ')));
      g.appendChild(h);
      xs.forEach(function(x){
        var c=CAT[x.cat]||CAT.other, row=el('button','erow');row.type='button';
        var bub=el('span','ic-bub');bub.style.setProperty('--bg','var(--'+c.color+')');bub.appendChild(icon(c.icon));
        var nm=el('span','nm',x.t);nm.appendChild(el('span','sub',x.payer+' 付'+(x.split==='self'?'・個人':'・平分')));
        row.appendChild(bub);row.appendChild(nm);row.appendChild(el('span','am',fmt(x.amt,x.cur)));
        row.onclick=function(){openExp(x)};g.appendChild(row);
      });
      list.appendChild(g);
    });
  }
  // 記帳視窗
  var emodal=$('expModal'), eform=$('expForm'), expId=null;
  function seg(box,name,opts){
    box.innerHTML='';
    opts.forEach(function(o){
      var lab=el('label'),r=el('input');r.type='radio';r.name=name;r.value=o[0];
      lab.appendChild(r);var sp=el('span');
      if(o[2]){var ic=icon(o[2],'');ic.style.cssText='width:16px;height:16px;vertical-align:-3px;margin-right:3px';sp.appendChild(ic);}
      sp.appendChild(document.createTextNode(o[1]));lab.appendChild(sp);box.appendChild(lab);
    });
  }
  function setSeg(box,v){var rs=box.querySelectorAll('input');var hit=false;rs.forEach(function(r){r.checked=r.value===v;if(r.checked)hit=true;});if(!hit&&rs[0])rs[0].checked=true;}
  function getSeg(box){var r=box.querySelector('input:checked');return r?r.value:'';}
  seg($('efDay'),'efDay',Object.keys(DAY_SHORT).map(function(k){return [k,DAY_SHORT[k]]}));
  seg($('efCur'),'efCur',[['JPY','日圓'],['TWD','台幣']]);
  seg($('efCat'),'efCat',CATS.map(function(c){return [c[0],c[1],c[2]]}));
  seg($('efSplit'),'efSplit',[['share','兩人平分'],['self','個人']]);
  function todayKey(){
    var d=new Date(Date.now()+8*3600000).toISOString().slice(0,10);
    var m={'2026-12-18':'d1','2026-12-19':'d2','2026-12-20':'d3','2026-12-21':'d4','2026-12-22':'d5','2026-12-23':'d6'};
    return m[d]||'pre';
  }
  function openExp(x){
    expId=x?x.id:null;
    seg($('efPayer'),'efPayer',members.map(function(m){return [m,m]}));
    $('expTitle').textContent=x?'修改記帳':'記一筆';
    setSeg($('efDay'),x?x.day:todayKey());
    $('efName').value=x?x.t:'';$('efAmt').value=x?String(x.amt):'';
    setSeg($('efCur'),x?x.cur:'JPY');setSeg($('efCat'),x?x.cat:'food');
    setSeg($('efPayer'),x?x.payer:me);setSeg($('efSplit'),x?x.split:'share');
    var del=$('efDel');del.hidden=!x;del.textContent='刪除';del.removeAttribute('data-sure');
    $('efErr').textContent='';emodal.hidden=false;
    setTimeout(function(){try{(x?$('efAmt'):$('efName')).focus()}catch(e){}},50);
  }
  function closeExp(){if(emodal)emodal.hidden=true;expId=null;}
  $('efCancel').onclick=closeExp;
  emodal.addEventListener('click',function(e){if(e.target===emodal)closeExp();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!emodal.hidden)closeExp();});
  $('efDel').onclick=function(){
    var b=this;
    if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='確定刪除？';return;}
    var id=expId;expenses=expenses.filter(function(x){return x.id!==id});renderMoney();closeExp();
    sendPlan('expRemove',{id:id});
  };
  onSubmit(eform,function(e){
    e.preventDefault();
    var name=$('efName').value.trim(), amt=Number(String($('efAmt').value).replace(/[,，\s]/g,''));
    if(!name){$('efErr').textContent='請輸入項目';return;}
    if(!(amt>0)){$('efErr').textContent='請輸入金額';return;}
    var data={id:expId,day:getSeg($('efDay')),t:name,amt:amt,cur:getSeg($('efCur')),cat:getSeg($('efCat')),payer:getSeg($('efPayer'))||me,split:getSeg($('efSplit'))};
    var sb=$('efSave');sb.disabled=true;$('efErr').textContent='儲存中…';
    sendPlan('expSave',data).then(function(ok){
      sb.disabled=false;
      if(ok)closeExp();else $('efErr').textContent='沒存到，稍後再試一次';
    });
  });

  /* ---------- 開始 ---------- */
  if(GAS_URL.indexOf('PASTE_')===0){pinErr.textContent='還沒設定 GAS 網址（index.html 裡的 GAS_URL）';return;}
  var saved=load(PKEY);
  if(saved){pinForm.hidden=true;pinErr.textContent='';
    var l=document.createElement('p');l.className='loading';l.textContent='載入中…';gate.querySelector('.card').appendChild(l);
    login(saved).finally(function(){if(l.parentNode)l.parentNode.removeChild(l);});
  }
})();
</script>
</body>
</html>
